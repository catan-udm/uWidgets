name: Publish to beta

on:
  workflow_dispatch:
  push:
    branches:
      - beta

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    strategy:
      matrix:
        runtime: [ win-x86, win-x64, win-arm64 ]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build .\src\uWidgets.sln --configuration Release

      - name: Upload build
        if: ${{ matrix.runtime == 'win-x64' }}
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .\src\uWidgets\bin\Release\net8.0

      - name: Publish App
        run: |
          dotnet publish .\src\uWidgets\uWidgets.csproj `
          --configuration Release `
          --runtime ${{ matrix.runtime }} `
          --output .\src\uWidgets\bin\Publish\${{ matrix.runtime }} `
          --self-contained false `
          /p:PublishReadyToRun=true

      - name: Publish Widgets
        run: |
          $widgetsPath = ".\src\Widgets"
          $publishPath = ".\src\uWidgets\bin\Publish\${{ matrix.runtime }}"
          $outputPath = "$publishPath\Widgets"
          if (-not (Test-Path -Path $outputPath)) {
            New-Item -Path $outputPath -ItemType Directory -Force
          }
          $widgetCsproj = Get-ChildItem -Path $widgetsPath -Recurse -Filter *.csproj
          
          foreach ($csproj in $widgetCsproj) {
            $widgetName = Split-Path $csproj.DirectoryName -Leaf

            dotnet publish $csproj.FullName `
              --configuration Release `
              --runtime ${{ matrix.runtime }} `
              --output $outputPath `
              --self-contained false `
              /p:PublishReadyToRun=true
          }
          
          Get-ChildItem -Path $publishPath -Filter *.pdb -Recurse | Remove-Item -Force
          Get-ChildItem -Path $publishPath -Filter *.xml -Recurse | Remove-Item -Force
          Get-ChildItem -Path $publishPath -Filter *.deps.json -Recurse | Remove-Item -Force
          Get-ChildItem -Path $publishPath -Filter *.runtimeconfig -Recurse | Remove-Item -Force

      - name: Archive
        run: |
          Compress-Archive `
            -Path .\src\uWidgets\bin\Publish\${{ matrix.runtime }} `
            -DestinationPath .\src\uWidgets\bin\Publish\${{ matrix.runtime }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ matrix.runtime }}
          path: .\src\uWidgets\bin\Publish\${{ matrix.runtime }}.zip

  release:
    runs-on: windows-latest
    needs: publish
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: publish-*
          merge-multiple: true
          path: .\src\uWidgets\bin\Publish

      - name: Get Assembly Version
        id: version
        run: |
          $filePath = ".\src\uWidgets\AssemblyInfo.cs"
          $content = [string](Get-Content $filePath)

          if ($content -match '\[assembly: AssemblyVersion\("([0-9]+\.[0-9]+\.[0-9]+)"\)\]') {
            $version = $matches[1]
            echo "Assembly Version: $version"
            echo "version=v$version" >> $env:GITHUB_OUTPUT
          } else {
            echo "AssemblyVersion not found in $filePath"
            exit 1
          }

      # Pushes to beta that don't bump AssemblyVersion must not fail the run.
      # If a release for this version already exists, skip everything below.
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.version }}"

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            echo "::notice::Release $tag already exists. Bump AssemblyVersion in src/uWidgets/AssemblyInfo.cs to publish a new release."
            echo "release_exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "release_exists=false" >> $env:GITHUB_OUTPUT
          }

          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            echo "tag_exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag_exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Create Tag
        if: ${{ steps.existing.outputs.release_exists == 'false' && steps.existing.outputs.tag_exists == 'false' }}
        run: |
          $tag = "${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $tag ${{ github.sha }}
          git push origin "refs/tags/$tag"

      - name: Get Changelog
        id: changelog
        if: ${{ steps.existing.outputs.release_exists == 'false' }}
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.version }}

      - name: Create Release
        if: ${{ steps.existing.outputs.release_exists == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGES: ${{ steps.changelog.outputs.changes }}
        run: |
          $tag = "${{ steps.version.outputs.version }}"
          $notes = "# Changelog:`n$env:CHANGES"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

          gh release create $tag `
            --repo "${{ github.repository }}" `
            --title "$tag" `
            --notes-file release-notes.md `
            .\src\uWidgets\bin\Publish\win-x86.zip `
            .\src\uWidgets\bin\Publish\win-x64.zip `
            .\src\uWidgets\bin\Publish\win-arm64.zip

  update-docs:
    runs-on: windows-latest
    needs: publish
    
    steps:  
      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
  
      # Pinned: v6.0.0 replaced --github-pages with --platform github-pages,
      # and an unpinned install picks up breaking changes automatically.
      - name: Install tool
        run: dotnet tool install -g XMLDoc2Markdown --version 6.0.0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build
          path: .
  
      - name: Run tool
        run: |
          xmldoc2md .\build\uWidgets.Core.dll `
            --output .\new-wiki\API `
            --platform github-pages `
            --index-page-name API
  
      # The wiki repo only exists after its first page is created in the GitHub UI.
      - name: Check wiki repository
        id: wiki
        run: |
          git ls-remote "https://github.com/${{ github.repository }}.wiki.git" *> $null
          if ($LASTEXITCODE -eq 0) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "::warning::Wiki for ${{ github.repository }} is not initialized. Create the first wiki page on GitHub to enable API docs publishing."
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Checkout wiki repository
        if: ${{ steps.wiki.outputs.exists == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
  
      - name: Update API docs
        if: ${{ steps.wiki.outputs.exists == 'true' }}
        run: |
          if (Test-Path -Path wiki\API) { Remove-Item -Recurse -Force wiki\API }
          New-Item -ItemType Directory -Path wiki\API
          Copy-Item -Path new-wiki\API\* -Destination wiki\API -Recurse
  
      - name: Commit & Push changes
        if: ${{ steps.wiki.outputs.exists == 'true' }}
        run: |
          cd wiki
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            echo "No API doc changes to commit."
            exit 0
          }
          git commit -m "Update API docs"
          git push
